<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=http://localhost:3000/" />
  <title>Freya</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8f6f3;
      color: #0e0807;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    p {
      margin: 1rem 0 1.75rem;
      font-size: 0.95rem;
      opacity: 0.7;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0 1.5rem;
      border-radius: 999px;
      background: #0e0807;
      color: #f8f6f3;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <main>
    <h1>Freya</h1>
    <p>正在打开本地站点…</p>
    <a href="http://localhost:3000/">打开 Freya</a>
  </main>
  <script>
    location.href = "http://localhost:3000/";
  </script>
</body>
</html>
